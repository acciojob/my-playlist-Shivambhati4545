<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>My Playlist</title>
</head>
<body>

  <!-- Headings -->
  <h1>My Playlist</h1>

  <!-- Songs Playlist -->
  <ul>
    <li><a href="#" target="_blank">Song 1</a></li>
    <li><a href="#" target="_blank">Song 2</a></li>
    <li><a href="#" target="_blank">Song 3</a></li>
    <li><a href="#" target="_blank">Song 4</a></li>
    <li><a href="#" target="_blank">Song 5</a></li>
  </ul>

  <!-- Video Player Section -->
  <h2>Now Playing...</h2>
  <div class="player_one">
    <video controls>
      <source src="https://www.w3schools.com/tags/movie.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Audio Player Section -->
  <h2>MP3 songs</h2>
  <div class="player_two">
    <p>Maan Meri Jaan</p>
    <audio controls>
      <source src="https://www.pagalworld.com.se/files/download/id/64630" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

</body>
</html>
